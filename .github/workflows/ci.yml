name: CI

on:
  pull_request:
    branches: [main]
  # Also run on main itself. Until now CI was pull_request-only, so nothing ever
  # tested the merge result: two PRs can each be green against the main they
  # branched from and still combine into a red main, and nobody would find out
  # until the next PR ran. 204 runs had accumulated, every one of them on a PR
  # head, and zero on main.
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      # The project id must never be hardcoded again. This is cheap and runs
      # before the suite so a reintroduced literal fails in seconds rather
      # than after the full corpus.
      - name: No hardcoded Firebase project id
        run: npm run check:env
      # src/test/noBrowserImportsInFunctions.test.js (part of "Run tests"
      # below) statically proves no Function's import graph reaches a
      # browser-only package. This step proves the thing that check predicts:
      # the actual bundled output Netlify deploys initializes under plain
      # Node. Deliberately NOT part of `npx vitest run` — Vite (and
      # therefore Vitest) injects a working import.meta.env, which is
      # exactly what is absent from Netlify's real esbuild-bundled runtime.
      # A check that only runs under Vitest cannot catch this class of bug;
      # see scripts/verifyFunctionBundlesInitialize.mjs's own header for the
      # production incident this is here because of, and why both the 'cjs'
      # and 'esm' esbuild output formats are checked.
      #
      # Scoped to the functions this incident actually touched, not --all:
      # a repo-wide run surfaces 9 pre-existing, unrelated bundle failures
      # ("Dynamic require of 'firebase-admin' is not supported" — an esbuild
      # limitation on some CommonJS-source files under ESM output) that
      # have nothing to do with this fix. Making this gate block on those
      # would entangle an unrelated, pre-existing issue with this one; run
      # `node scripts/verifyFunctionBundlesInitialize.mjs --all` by hand to
      # audit the rest as its own, separate piece of work.
      - name: Verify function bundles initialize (production-equivalent)
        run: node scripts/verifyFunctionBundlesInitialize.mjs
      # Test exclusions (policy, 2026-08-28): this gate runs the whole corpus.
      # An exclusion added here must carry, in a comment beside it: the reason,
      # a named owner, and the condition or date on which it is removed. An
      # exclusion with no removal condition is a permanent blind spot — the
      # previous list was added for one red run on 2026-07-24 and silently
      # outlived its cause by five weeks, hiding a real failure from CI.
      - name: Run tests
        run: npx vitest run

  # Firestore security rules, against a real emulator on a throwaway project.
  #
  # This exists because reasoning about rules is not enough. The append-only
  # ruleset was wrong twice before it was ever run: `document.size()` does not
  # exist for a recursive-wildcard binding (and an erroring rule DENIES, so it
  # broke ordinary writes), and a recursive wildcard matches zero or more
  # segments, so the deep rule re-granted what the narrow rule withheld. Both
  # read as correct. Neither would have failed at deploy time.
  #
  # The suite reads the LIVE firestore.rules, so any change to it is checked
  # here before the PR is reviewable.
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # firebase-tools refuses any JDK below 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install rules-check dependencies
        working-directory: scripts/rules-check
        run: npm install
      # Run from the repo ROOT: the CLI refuses a rules path outside the
      # project directory, so it must use the root firebase.json.
      # The suites share one emulator start. `rules` covers who may write;
      # `stickers` covers the sticker rules (ADR-007), including the rollout
      # modes and the rollback variant; `sticker-services` runs the app's own
      # sticker code against those rules, concurrency included;
      # `stickers-flag-parity` checks the rules, stickersConfig and the app's
      # availability hook agree in every rollout mode;
      # `write-semantics` covers what a write
      # does to the fields it was not told about — the class of bug a mock
      # cannot catch, because the thing under test is Firestore's own PATCH
      # behaviour.
      - name: Run the rules suite
        run: npx --yes firebase-tools@15 emulators:exec --only firestore --project demo-icp-rules "node scripts/rules-check/cases.mjs && node scripts/rules-check/stickers.mjs && node scripts/rules-check/sticker-services.mjs && node scripts/rules-check/stickers-flag-parity.mjs && node scripts/rules-check/write-semantics.mjs"

  # Billing hardening (PR 1): webhook/checkout/credit-tracking concurrency and fencing, against a
  # real Firestore emulator. These are vitest files under src/test/ that the plain `test` job
  # above SKIPS (describe.skipIf — no FIRESTORE_EMULATOR_HOST there), by design, so that `npm
  # test` doesn't crash for anyone without the emulator. That design only stays safe if this job
  # exists and is required: skipped tests report green, so without this job a PR touching
  # stripe-webhook.js / create-checkout-session.js / creditTracking.js could merge never having
  # actually run the ownership/fencing/concurrency assertions — exactly the class of bug a mock
  # can't catch, which is why these are real-transaction tests, not mocked ones.
  billing-emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install rules-check dependencies (hosts the firebase-tools emulator binary)
        working-directory: scripts/rules-check
        run: npm install
      - name: Run the billing emulator suite
        run: npm run test:billing-emulator
