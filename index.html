<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Mobile viewport: viewport-fit=cover allows content to extend under notch/home indicator.
         CSS env(safe-area-inset-*) is then used to push content out of those zones. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA / iOS web app meta -->
    <!-- Allows the app to run in standalone mode (no Safari UI chrome) when added to home screen -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="IDYNIFY" />
    <!-- Android / Chrome: tints the browser address bar to match the app brand colour -->
    <meta name="theme-color" content="#ec4899" />
    <!-- Manifest link — see /public/manifest.json (to be created) -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Inter font — preconnect first to avoid layout shift, then load stylesheet -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Primary Meta Tags -->
    <title>IDYNIFY | AI Relationship Intelligence for Sales</title>
    <script>if(matchMedia('(display-mode:standalone)').matches||navigator.standalone)document.title='IDYNIFY';</script>
    <meta name="title" content="IDYNIFY | AI Relationship Intelligence for Sales" />
    <meta name="description" content="Know who matters, why they matter, and what to do next. IDYNIFY uses Barry AI to connect your prospects, conversations, and relationships so you can focus on the right opportunities." />
    <link rel="canonical" href="https://idynify.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://idynify-scout.netlify.app/" />
    <meta property="og:title" content="IDYNIFY" />
    <meta property="og:description" content="It's like Tinder for your ICP" />
    <meta property="og:image" content="https://idynify-scout.netlify.app/social-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://idynify-scout.netlify.app/" />
    <meta property="twitter:title" content="IDYNIFY" />
    <meta property="twitter:description" content="It's like Tinder for your ICP" />
    <meta property="twitter:image" content="https://idynify-scout.netlify.app/social-preview.png" />

    <!-- Structured data for Google -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "IDYNIFY",
      "description": "Know who matters, why they matter, and what to do next. IDYNIFY uses Barry AI to connect your prospects, conversations, and relationships so you can focus on the right opportunities.",
      "applicationCategory": "BusinessApplication",
      "url": "https://idynify.com"
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
