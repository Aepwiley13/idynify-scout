[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 7 requires Node >=20.19.0 or >=22.12.0.
  # Netlify's default Node 20 is pre-20.19, so pin explicitly.
  NODE_VERSION = "22"

# ─── Non-production contexts ─────────────────────────────────────────────────
#
# DEFENCE IN DEPTH ONLY. Read the limits before trusting this.
#
# There is one Firebase project, `idynify-scout-dev`, and it serves production.
# Branch deploys and deploy previews resolve to it as well, so a non-production
# deploy reads and writes real customer data (ADR-006, "What dry_run actually
# guarantees"). These two blocks narrow that exposure. They do not remove it.
#
# What this does NOT do:
#
#   · It probably changes nothing for the scheduled functions. Netlify runs
#     those on the production deploy, so DISCOVERY_CRON_ENABLED never reaches
#     a branch-deploy cron because no branch-deploy cron exists. The setting is
#     here so that if that assumption is ever wrong — or changes — the answer
#     is already "off" rather than "nobody checked".
#   · It does not stop the ~76 HTTP functions that write Firestore. Every one
#     of them is mounted and callable on a branch-deploy URL, and none consults
#     the deploy context.
#   · It does not stop the browser. src/firebase/config.js hardcodes
#     projectId: "idynify-scout-dev" with no environment variable involved, so
#     a signed-in user on a preview URL writes production directly from the
#     web SDK, server-side settings notwithstanding.
#   · dry_run is not write-free. Per ADR-006 it still persists
#     communication_records, unmatched_messages, the contact timeline,
#     relationship_context and identity_resolution_probe.
#
# The access restrictions configured in the Netlify UI are the control that
# actually limits who can reach a preview. This file makes the two automated
# writers fail safe if someone gets past that.

[context.branch-deploy.environment]
  DISCOVERY_CRON_ENABLED = "false"
  GMAIL_IDENTITY_MODE = "dry_run"

[context.deploy-preview.environment]
  DISCOVERY_CRON_ENABLED = "false"
  GMAIL_IDENTITY_MODE = "dry_run"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."generate-icp-brief"]
  timeout = 900

[functions."generate-all-reports"]
  timeout = 900

[functions."generate-section-1"]
  timeout = 900

[functions."generate-section-2"]
  timeout = 900

[functions."generate-leads"]
  timeout = 900

[functions."generate-leads-v2"]
  timeout = 900

[functions."daily-leads-refresh"]
  timeout = 900

[functions."process-barry-queue"]
  timeout = 900

[functions."process-scheduled-engagements"]
  timeout = 900

[functions."process-barry-inbox-queue"]
  timeout = 300

# Scheduled every 10 minutes. Walks up to 50 connected Gmail accounts and
# ingests each new message through Team B's pipeline — needs room beyond the
# default synchronous timeout. The worker also enforces its own time budget.
[functions."gmail-sync-worker"]
  timeout = 300

[functions."adminGetUsers"]
  timeout = 26

[functions."barryBulkPersonalize"]
  timeout = 26

# analyze-website fetches an external site (10s cap) then calls Barry to extract
# a business profile — give it headroom beyond the default function timeout.
[functions."analyze-website"]
  timeout = 26

[dev]
  framework = "#custom"
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  
# Content Security Policy applied to all pages.
# 'unsafe-inline' is required for React's inline styles and Vite's injected
# module-preload polyfill. 'unsafe-eval' is required by Firebase SDK.
# Tighten these once a nonce-based approach is adopted.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com https://apis.google.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https:; worker-src 'self' blob:; frame-src 'self' https:; media-src 'self' https:;"

# index.html must never be cached — ensures browsers always fetch the latest
# build on navigation so the ETag-based version check works correctly.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# manifest.json is also not hashed, so keep it fresh too.
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Vite's hashed JS/CSS assets can be cached indefinitely — the hash changes
# with every new build so stale content is never served.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200